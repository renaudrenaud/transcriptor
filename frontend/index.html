<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcriptor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      width: 100%;
      max-width: 640px;
    }

    header h1 { font-size: 1.8rem; font-weight: 700; }
    header p  { color: #666; margin-top: .4rem; }
    header .version { color: #aaa; font-size: .8rem; margin-top: .25rem; }

    .lang-switch {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: .25rem;
    }
    .lang-switch button {
      flex: none;
      padding: .25rem .5rem;
      font-size: .75rem;
      font-weight: 600;
      background: #fff;
      color: #aaa;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: all .15s;
    }
    .lang-switch button.active {
      background: #4f6ef7;
      color: #fff;
      border-color: #4f6ef7;
    }
    .lang-switch button:hover:not(.active) { color: #4f6ef7; border-color: #4f6ef7; }

    footer {
      margin-top: 2rem;
      font-size: .8rem;
      color: #aaa;
      text-align: center;
    }
    footer a { color: #4f6ef7; text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 2rem;
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #4f6ef7;
      background: #f0f3ff;
    }
    .drop-zone.has-file {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .drop-zone input { display: none; }
    .drop-zone .icon { font-size: 2rem; margin-bottom: .5rem; }
    .drop-zone .label { color: #555; font-size: .95rem; }
    .drop-zone .filename { color: #16a34a; font-weight: 600; margin-top: .4rem; font-size: .9rem; }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .field label { font-size: .85rem; font-weight: 600; color: #444; }
    .field select {
      padding: .5rem .75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .95rem;
      background: #fff;
    }

    button {
      flex: 1;
      padding: .65rem 1.5rem;
      background: #4f6ef7;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover:not(:disabled) { background: #3b55d4; }
    button:disabled { background: #a0a0a0; cursor: not-allowed; }

    .status {
      font-size: .9rem;
      color: #555;
      min-height: 1.2rem;
      text-align: center;
    }
    .status.error { color: #dc2626; }

    .result-block { display: none; flex-direction: column; gap: .75rem; }
    .result-block.visible { display: flex; }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: .75rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: .9rem;
      font-family: inherit;
      resize: vertical;
      line-height: 1.5;
    }

    .result-actions { display: flex; gap: .75rem; }

    .btn-secondary {
      background: #fff;
      color: #4f6ef7;
      border: 1.5px solid #4f6ef7;
    }
    .btn-secondary:hover:not(:disabled) { background: #f0f3ff; }
  </style>
</head>
<body>

<header>
  <div class="lang-switch">
    <button id="btnFr" class="active" onclick="setLang('fr')">FR</button>
    <button id="btnEn" onclick="setLang('en')">EN</button>
  </div>
  <h1>Transcriptor</h1>
  <p id="subtitle"></p>
  <div class="version" id="version"></div>
</header>

<div class="card">

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".mp3,audio/mpeg">
    <div class="icon">🎙️</div>
    <div class="label" id="dropLabel"></div>
    <div class="filename" id="filename"></div>
  </div>

  <div class="controls">
    <div class="field">
      <label for="lang" id="langLabel"></label>
      <select id="lang">
        <option value="fr" id="optFr"></option>
        <option value="en" id="optEn"></option>
        <option value="auto" id="optAuto"></option>
      </select>
    </div>
    <button id="transcribeBtn" disabled></button>
  </div>

  <div class="status" id="status"></div>

  <div class="result-block" id="resultBlock">
    <textarea id="result" readonly></textarea>
    <div class="result-actions">
      <button class="btn-secondary" id="copyBtn"></button>
      <button class="btn-secondary" id="downloadBtn"></button>
    </div>
  </div>

</div>

<footer>
  <a href="https://github.com/renaudrenaud/transcriptor" target="_blank" rel="noopener">github.com/renaudrenaud/transcriptor</a>
</footer>

<script>
  const i18n = {
    fr: {
      subtitle:     'Transcription audio locale — confidentielle & rapide',
      dropLabel:    'Glissez un fichier <strong>MP3</strong> ici ou <strong>cliquez pour parcourir</strong>',
      langLabel:    'Langue',
      optFr:        'Français',
      optEn:        'English',
      optAuto:      'Auto-détection',
      transcribe:   'Transcrire',
      inProgress:   'Transcription en cours… (environ 2 min pour 1h d\'audio)',
      done:         'Transcription terminée.',
      copy:         'Copier',
      copied:       'Copié !',
      download:     'Télécharger .txt',
      errFormat:    'Format non supporté — seuls les fichiers MP3 sont acceptés.',
      errTimeout:   'Délai dépassé — le fichier est trop long pour être traité dans le temps imparti. Contactez l\'administrateur pour augmenter le timeout.',
      errServer:    'Erreur serveur',
    },
    en: {
      subtitle:     'Local audio transcription — private & fast',
      dropLabel:    'Drop an <strong>MP3</strong> file here or <strong>click to browse</strong>',
      langLabel:    'Language',
      optFr:        'French',
      optEn:        'English',
      optAuto:      'Auto-detect',
      transcribe:   'Transcribe',
      inProgress:   'Transcribing… (approx. 2 min per hour of audio)',
      done:         'Transcription complete.',
      copy:         'Copy',
      copied:       'Copied!',
      download:     'Download .txt',
      errFormat:    'Unsupported format — only MP3 files are accepted.',
      errTimeout:   'Request timed out — the file is too long to process within the configured limit. Ask your administrator to increase the timeout.',
      errServer:    'Server error',
    }
  };

  let locale = localStorage.getItem('locale') || 'fr';
  let selectedFile = null;

  function setLang(l) {
    locale = l;
    localStorage.setItem('locale', l);
    document.documentElement.lang = l;
    document.getElementById('btnFr').classList.toggle('active', l === 'fr');
    document.getElementById('btnEn').classList.toggle('active', l === 'en');
    const t = i18n[l];
    document.getElementById('subtitle').innerHTML   = t.subtitle;
    document.getElementById('dropLabel').innerHTML  = t.dropLabel;
    document.getElementById('langLabel').textContent = t.langLabel;
    document.getElementById('optFr').textContent    = t.optFr;
    document.getElementById('optEn').textContent    = t.optEn;
    document.getElementById('optAuto').textContent  = t.optAuto;
    document.getElementById('transcribeBtn').textContent = t.transcribe;
    document.getElementById('copyBtn').textContent  = t.copy;
    document.getElementById('downloadBtn').textContent   = t.download;
  }

  // Version
  fetch('/VERSION').then(r => r.ok ? r.text() : null).then(v => {
    if (v) document.getElementById('version').textContent = 'v' + v.trim();
  }).catch(() => {});

  // Init
  setLang(locale);

  const dropZone      = document.getElementById('dropZone');
  const fileInput     = document.getElementById('fileInput');
  const filenameEl    = document.getElementById('filename');
  const transcribeBtn = document.getElementById('transcribeBtn');
  const langSelect    = document.getElementById('lang');
  const statusEl      = document.getElementById('status');
  const resultBlock   = document.getElementById('resultBlock');
  const resultEl      = document.getElementById('result');
  const copyBtn       = document.getElementById('copyBtn');
  const downloadBtn   = document.getElementById('downloadBtn');

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file) setFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    if (!file.name.toLowerCase().endsWith('.mp3') && file.type !== 'audio/mpeg') {
      statusEl.className = 'status error';
      statusEl.textContent = i18n[locale].errFormat;
      return;
    }
    selectedFile = file;
    filenameEl.textContent = file.name;
    dropZone.classList.add('has-file');
    transcribeBtn.disabled = false;
    statusEl.textContent = '';
    statusEl.className = 'status';
    resultBlock.classList.remove('visible');
  }

  transcribeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    transcribeBtn.disabled = true;
    statusEl.className = 'status';
    statusEl.textContent = i18n[locale].inProgress;
    resultBlock.classList.remove('visible');

    const formData = new FormData();
    formData.append('file', selectedFile, selectedFile.name);
    formData.append('model', 'whisper-1');
    formData.append('response_format', 'text');

    const lang = langSelect.value;
    if (lang !== 'auto') formData.append('language', lang);

    try {
      const res = await fetch('/api/v1/audio/transcriptions', { method: 'POST', body: formData });

      if (res.status === 504) throw new Error(i18n[locale].errTimeout);
      if (!res.ok) throw new Error(`${i18n[locale].errServer} : ${res.status} ${res.statusText}`);

      const text = await res.text();
      resultEl.value = text.trim();
      resultBlock.classList.add('visible');
      statusEl.textContent = i18n[locale].done;
    } catch (err) {
      statusEl.className = 'status error';
      statusEl.textContent = err.message;
    } finally {
      transcribeBtn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resultEl.value);
    copyBtn.textContent = i18n[locale].copied;
    setTimeout(() => copyBtn.textContent = i18n[locale].copy, 2000);
  });

  downloadBtn.addEventListener('click', () => {
    const basename = selectedFile ? selectedFile.name.replace(/\.[^.]+$/, '') : 'transcription';
    const blob = new Blob([resultEl.value], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), { href: url, download: basename + '.txt' });
    a.click();
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
